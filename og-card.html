<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<!-- OG card template — render at exactly 1200×630 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", sans-serif;
    background:
      radial-gradient(900px 480px at 88% -12%, rgba(127,208,255,.16), transparent 60%),
      radial-gradient(760px 520px at 8% 6%, rgba(167,139,250,.16), transparent 55%),
      radial-gradient(700px 420px at 55% 115%, rgba(233,196,106,.13), transparent 60%),
      #070b18;
    color: #e9ecf5;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  /* stars */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 80px 90px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 210px 40px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 340px 170px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 470px 70px, rgba(127,208,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 590px 210px, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 720px 120px, rgba(233,196,106,.7), transparent),
      radial-gradient(1.5px 1.5px at 860px 260px, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 980px 90px, rgba(167,139,250,.7), transparent),
      radial-gradient(1.5px 1.5px at 1090px 200px, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 200px 300px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 700px 380px, rgba(127,208,255,.5), transparent),
      radial-gradient(1px 1px at 1050px 360px, rgba(233,196,106,.5), transparent),
      radial-gradient(1px 1px at 500px 500px, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 1180px 120px, rgba(255,255,255,.6), transparent);
    pointer-events: none;
  }

  .eyebrow {
    position: relative;
    font-size: 15px; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase;
    color: #9aa3b8; margin-bottom: 26px;
  }

  .glyphs {
    position: relative;
    display: flex; align-items: center; gap: 44px;
    margin-bottom: 18px;
  }
  .glyphs .cap { font-size: 118px; color: #e9c46a; line-height: 1; text-shadow: 0 0 34px rgba(233,196,106,.4); }
  .glyphs .x   { font-size: 52px; color: #9aa3b8; font-family: "Fraunces", serif; }
  .glyphs .aq  { font-size: 118px; color: #7fd0ff; line-height: 1; text-shadow: 0 0 34px rgba(127,208,255,.4); }

  .title {
    position: relative;
    font-family: "Fraunces", serif;
    font-size: 56px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.12;
    background: linear-gradient(120deg, #f4d99b 0%, #7fd0ff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    padding: 0 80px;
  }

  .sub {
    position: relative;
    font-size: 19px; color: #9aa3b8; margin-top: 16px; letter-spacing: .01em;
  }

  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 70px 44px;
  }
  .brand { font-family: "Fraunces", serif; font-size: 22px; font-weight: 700; color: #e9ecf5; }
  .brand .glyph { background: linear-gradient(120deg, #e9c46a, #7fd0ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px; }
  .url { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: #9aa3b8; }

  .score {
    position: absolute; top: 0; right: 0; margin: 44px 56px;
    padding: 12px 26px; border-radius: 999px;
    border: 1.5px solid rgba(167,139,250,.55);
    color: #c4b5fd; font-size: 21px; font-weight: 800; letter-spacing: .03em;
    background: rgba(167,139,250,.10);
  }
</style>
</head>
<body>
  <div class="score">7.0 / 10</div>
  <p class="eyebrow">Astro Compatibility · Deep Research</p>
  <div class="glyphs"><span class="cap">♑</span><span class="x">×</span><span class="aq">♒</span></div>
  <h1 class="title">Pria Capricorn × Wanita Aquarius</h1>
  <p class="sub">Edisi Januari — dua jiwa Saturnus, riset mendalam kompatibilitas zodiak</p>
  <div class="bottom">
    <span class="brand"><span class="glyph">♑♒</span> CapAq</span>
    <span class="url">ataraxianusa.github.io/capaq</span>
  </div>
</body>
</html>
